<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML en imágenes</title>
  </head>
  <body>
    <h1>HTML en imágenes</h1>

    <p>
      Cuatro imágenes que resumen las ideas más <strong>importantes</strong> de
      <strong>HTML</strong>: el documento, las <em>etiquetas</em>, los enlaces y el navegador.
    </p>

    <h2>El documento HTML</h2>
    <img src="../img/foto1.webp" alt="Etiqueta html sobre fondo naranja: HTML es el lenguaje de la web" />

    <h2>Las etiquetas</h2>
    <img src="../img/foto2.webp" alt="Etiquetas p y h1 sobre fondo azul: las etiquetas marcan el contenido" />

    <h2>El hipertexto</h2>
    <img src="../img/foto3.webp" alt="Etiqueta a con href sobre fondo verde: los enlaces conectan páginas" />

    <h2>El navegador</h2>
    <img src="../img/foto4.webp" alt="Declaración DOCTYPE sobre fondo gris: el navegador interpreta el HTML" />

    <p><a href="../index.html">Volver a la página principal</a></p>
  </body>
</html>
